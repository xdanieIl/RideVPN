spring.application.name=RideVPN

spring.datasource.url=jdbc:postgresql://localhost:5432/ridevpn
spring.datasource.username=ridevpn
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

wireguard.server-public-key=${WG_SERVER_PUBLIC_KEY}
wireguard.endpoint=${WG_ENDPOINT}
ridevpn.client-installer=${RIDEVPN_CLIENT_INSTALLER:/opt/ridevpn/client/RideVPN-Setup.exe}
