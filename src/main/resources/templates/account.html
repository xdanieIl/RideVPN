<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideVPN — Account</title>
  <link rel="icon" href="/images/ridevpn-icon.svg" th:href="@{/images/ridevpn-icon.svg}" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}">
  <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
  <script src="/js/app.js" th:src="@{/js/app.js}" defer></script>
</head>
<body>
  <div class="app-shell" data-theme="dark">
    <header class="site-header">
      <a href="/dashboard" th:href="@{/dashboard}" class="brand" aria-label="RideVPN home">
        <img class="brand-logo brand-dark" src="/images/ridevpn-logo.svg" th:src="@{/images/ridevpn-logo.svg}" alt="RideVPN" width="170" height="36">
        <img class="brand-logo brand-light" src="/images/ridevpn-logo-light.svg" th:src="@{/images/ridevpn-logo-light.svg}" alt="RideVPN" width="170" height="36">
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="/dashboard" th:href="@{/dashboard}" class="nav-link">Dashboard</a>
        <a href="/settings" th:href="@{/settings}" class="nav-link">Settings</a>
        <a href="/account" th:href="@{/account}" class="nav-link active-nav">Account</a>
        <form class="logout-form" th:action="@{/logout}" method="post"><button type="submit" class="header-action">Sign out</button></form>
        <button class="header-action theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false" title="Switch to light mode">
          <svg class="tt__svg" viewBox="0 0 24 24" aria-hidden="true">
            <mask id="ride-theme-bite">
              <rect x="0" y="0" width="24" height="24" fill="#fff" />
              <circle class="tt__bite" cx="24" cy="0" r="6.4" fill="#000" />
            </mask>
            <g class="tt__rays">
              <line pathLength="1" style="--i: 0" x1="19.60" y1="12.00" x2="22.70" y2="12.00" />
              <line pathLength="1" style="--i: 1" x1="17.37" y1="17.37" x2="19.57" y2="19.57" />
              <line pathLength="1" style="--i: 2" x1="12.00" y1="19.60" x2="12.00" y2="22.70" />
              <line pathLength="1" style="--i: 3" x1="6.63" y1="17.37" x2="4.43" y2="19.57" />
              <line pathLength="1" style="--i: 4" x1="4.40" y1="12.00" x2="1.30" y2="12.00" />
              <line pathLength="1" style="--i: 5" x1="6.63" y1="6.63" x2="4.43" y2="4.43" />
              <line pathLength="1" style="--i: 6" x1="12.00" y1="4.40" x2="12.00" y2="1.30" />
              <line pathLength="1" style="--i: 7" x1="17.37" y1="6.63" x2="19.57" y2="4.43" />
            </g>
            <circle class="tt__disc" cx="12" cy="12" r="5.4" mask="url(#ride-theme-bite)" />
          </svg>
        </button>
      </nav>
    </header>

    <!-- Links for small phones -->
    <nav class="mobile-nav">
      <a href="/dashboard" th:href="@{/dashboard}">Dashboard</a>
      <a href="/settings" th:href="@{/settings}">Settings</a>
      <a href="/account" th:href="@{/account}" class="active-nav">Account</a>
    </nav>

    <main class="page">
      <div class="page-title">
        <h1>Account</h1>
        <p>Member since <span th:text="${memberSince}"></span>.</p>
      </div>

      <p class="form-message" th:if="${message}" th:text="${message}" role="status"></p><p class="form-message form-error" th:if="${error}" th:text="${error}" role="alert"></p>
      <section class="section">
        <h2>Profile</h2><form th:action="@{/account/email}" method="post">
        <div class="fields">
          <div class="form-field">
            <label for="username">Username</label>
            <input id="username" type="text" th:value="${username}" disabled>
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" th:value="${email}" required maxlength="254" autocomplete="email">
          </div>
        </div>
        <div class="buttons">
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form></section>

      <section class="section">
        <h2>Password</h2><form th:action="@{/account/password}" method="post">
        <div class="fields">
          <div class="form-field">
            <label for="current-password">Current password</label>
            <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
          </div>
          <div class="form-field">
            <label for="new-password">New password</label>
            <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
          </div>
          <div class="form-field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
          </div>
        </div>
        <div class="buttons">
          <button class="primary-button" type="submit">Update password</button>
        </div>
      </form></section>

      <section class="section">
        <h2>Delete account</h2>
        <div class="row">
          <div><b>Delete my account</b><span>Self-service deletion is not available yet.</span></div>
          <button class="outline-button" type="button" disabled>Unavailable</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
